; CYD Resource Monitor - "SYSTEM RESEARCH / NODE 01"
;
;   pio run -e esp32dev      -t upload     (panel needs colour inversion - the usual CYD)
;   pio run -e cyd-noinvert  -t upload     (second CYD revision: colours are right as-is)
;   pio test -e native                     host unit tests (no board needed)
;   pio device monitor

[platformio]
; plain `pio run` and the VS Code Build/Upload buttons use this env (CI / release rely on it).
; The native env (unit tests) has no main() and only builds under `pio test`.
default_envs = esp32dev

[common]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
    ; -- TFT_eSPI CYD config --
    -D USER_SETUP_LOADED=1
    ; panel is 240x320 native (set by the driver); setRotation(1) makes it landscape 320x240
    -D ILI9341_2_DRIVER=1
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=12
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D TOUCH_CS=33
    -D SPI_FREQUENCY=65000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    ; the UI draws its own anti-aliased fonts; TFT_eSPI only needs one font to compile
    -D LOAD_GLCD=1
    -I src

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/Bodmer/TFT_Touch.git
    bblanchon/ArduinoJson @ ^7.0.0

; original board: colours are wrong without inversion
[env:esp32dev]
extends = common
build_flags =
    ${common.build_flags}
    -D TFT_INVERSION_ON=1

; second board revision: panel shows correct colours as-is
[env:cyd-noinvert]
extends = common
build_flags =
    ${common.build_flags}
    -D TFT_INVERSION_OFF=1

; Host unit tests for everything that isn't hardware: JSON parsing (incl. missing fields),
; model / staleness, renderer region pushes, settings taps, simulator, theme assets.
;   pio test -e native
[env:native]
platform = native
test_build_src = yes
build_src_filter =
    -<*>
    +<ui/canvas.cpp> +<ui/monitor_model.cpp> +<ui/monitor_ui.cpp> +<ui/settings_ui.cpp>
    +<ui/detail_ui.cpp> +<ui/widgets.cpp> +<ui/theme.cpp>
    +<data/telemetry.cpp> +<data/sim_source.cpp>
build_flags = -std=gnu++17 -I src -Wall
lib_deps = bblanchon/ArduinoJson @ ^7.0.0
